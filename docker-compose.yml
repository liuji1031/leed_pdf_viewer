name: leedpdf

# PUBLIC_* are consumed by SvelteKit's $env/static/public, which is INLINED AT
# BUILD TIME. They are build args for the production image and plain env for
# dev/test (where `svelte-kit sync` generates the module's types from them).
# Empty defaults keep `pnpm check` passing without a .env file.
x-public-env: &public-env
  PUBLIC_POSTHOG_KEY: ${PUBLIC_POSTHOG_KEY:-}
  PUBLIC_APPWRITE_ENDPOINT: ${PUBLIC_APPWRITE_ENDPOINT:-}
  PUBLIC_APPWRITE_PROJECT_ID: ${PUBLIC_APPWRITE_PROJECT_ID:-}
  PUBLIC_APPWRITE_DATABASE_ID: ${PUBLIC_APPWRITE_DATABASE_ID:-}
  PUBLIC_APPWRITE_STORAGE_BUCKET_ID: ${PUBLIC_APPWRITE_STORAGE_BUCKET_ID:-}
  PUBLIC_APPWRITE_SHARED_PDFS_COLLECTION_ID: ${PUBLIC_APPWRITE_SHARED_PDFS_COLLECTION_ID:-}
  PUBLIC_APPWRITE_PDF_ANNOTATIONS_COLLECTION_ID: ${PUBLIC_APPWRITE_PDF_ANNOTATIONS_COLLECTION_ID:-}

# Chat: the /api/openrouter relay adds this key and default model server-side,
# so neither is entered in (or stored by) the browser.
x-openrouter-env: &openrouter-env
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
  OPENROUTER_SUMMARY_MODEL: ${OPENROUTER_SUMMARY_MODEL:-}

# Paper database (SQLite): each paper's parse, chats and annotations, shared by
# every browser using this server. A host directory rather than a named volume,
# so `docker volume prune` can't delete it. It must exist and be writable by
# uid 1000 before the first start, or Docker creates it owned by root.
x-paper-db-env: &paper-db-env
  PAPER_DB_PATH: /data/leedpdf.db
x-paper-db-mount: &paper-db-mount ${PAPER_DATA_DIR:-./data}:/data

# Source bind-mount plus an anonymous volume that shadows node_modules, so the
# image's installed dependencies survive the mount instead of being hidden by
# the (absent) host node_modules. Containers run as uid 1000 (see Dockerfile),
# so generated output such as .svelte-kit/ and build/ lands in the checkout
# owned by the host user. Docker leaves an empty node_modules/ mount point on
# the host; it's gitignored and deletable without sudo.
x-source-mount: &source-mount
  - .:/app
  - /app/node_modules

services:
  # ---------------------------------------------------------------------
  # Vite dev server with HMR.  http://localhost:5173, and from other devices
  # on the network http://leed-pdf-viewer.local:5173 (see `mdns`).
  # ---------------------------------------------------------------------
  dev:
    profiles: [dev]
    build:
      context: .
      target: dev
    environment:
      <<: [*public-env, *openrouter-env, *paper-db-env]
      # Host-side address the browser connects back to for HMR. Empty means
      # the address the page was loaded from, which works from any device;
      # if set, it must be the host's value, not the container's.
      VITE_HMR_HOST: ${VITE_HMR_HOST:-}
      VITE_HMR_PORT: ${VITE_HMR_PORT:-5173}
      VITE_DEV_MODE: "true"
      # The app reaches MinerU through its own /api/mineru route (browsers
      # can't call MinerU directly — it sends no CORS headers).
      MINERU_URL: ${MINERU_URL:-http://mineru:8000}
      MINERU_API_KEY: ${MINERU_API_KEY:-}
    volumes:
      - .:/app
      - /app/node_modules
      - *paper-db-mount
    ports:
      - "${DEV_PORT:-5173}:5173"
    depends_on:
      mineru:
        condition: service_healthy
        required: false

  # ---------------------------------------------------------------------
  # MinerU document parser (CPU, `flash` tier). Not published to the host:
  # the app is its only client. Set MINERU_URL to use another server, e.g.
  # https://mineru.net/api with MINERU_API_KEY.
  # ---------------------------------------------------------------------
  mineru:
    profiles: [dev, prod]
    build:
      context: docker/mineru
    volumes:
      - mineru-models:/models
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Names this machine leed-pdf-viewer.local on the local network, so other
  # devices on the same Wi-Fi reach the app at leed-pdf-viewer.local:<port>.
  # Publishes through the host's Avahi daemon (Linux hosts; needs
  # avahi-daemon running), so it shares the host's network and D-Bus.
  # MDNS_NAME picks another name.
  # ---------------------------------------------------------------------
  mdns:
    profiles: [dev, prod]
    build:
      context: docker/mdns
    network_mode: host
    environment:
      MDNS_NAME: ${MDNS_NAME:-leed-pdf-viewer.local}
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    # Docker's default AppArmor profile has no D-Bus rules, so the host's bus
    # refuses the container ("Access denied") on AppArmor hosts like Ubuntu.
    security_opt:
      - apparmor=unconfined
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Production: the adapter-node build. http://localhost:3000, and
  # http://leed-pdf-viewer.local:3000 from other devices (see `mdns`).
  #   docker compose --profile prod up -d --build
  # PUBLIC_* are build args (inlined at build time); see .env.docker.example.
  # ---------------------------------------------------------------------
  app:
    profiles: [prod]
    build:
      context: .
      target: runtime
      args:
        <<: *public-env
    environment:
      MINERU_URL: ${MINERU_URL:-http://mineru:8000}
      MINERU_API_KEY: ${MINERU_API_KEY:-}
      <<: [*openrouter-env, *paper-db-env]
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      # adapter-node needs the public origin for form actions / CSRF checks.
      ORIGIN: ${ORIGIN:-http://${MDNS_NAME:-leed-pdf-viewer.local}:${APP_PORT:-3000}}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-110M}
    volumes:
      - *paper-db-mount
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      mineru:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Unit tests (vitest + jsdom).
  #   docker compose --profile test run --rm unit
  # Extra args pass through:  ... run --rm unit pnpm test:run textAnchor
  # ---------------------------------------------------------------------
  unit:
    profiles: [test]
    build:
      context: .
      target: test
    environment: *public-env
    volumes: *source-mount

  # ---------------------------------------------------------------------
  # Type checking — same image as unit, different command.
  #   docker compose --profile test run --rm typecheck
  # ---------------------------------------------------------------------
  typecheck:
    profiles: [test]
    build:
      context: .
      target: test
    environment: *public-env
    volumes: *source-mount
    command: ["pnpm", "check"]

  # ---------------------------------------------------------------------
  # Playwright e2e — see the `e2e` Dockerfile stage for the image pinning.
  #
  # playwright.config.ts already starts its own server via `webServer`
  # (build + preview on 4173), so this service is self-contained and does not
  # depend on `dev`. The image has no Google Chrome, so the config's
  # `channel: 'chrome'` project can't run here; pass --project to pick others.
  # ---------------------------------------------------------------------
  e2e:
    profiles: [test]
    build:
      context: .
      target: e2e
    environment: *public-env
    volumes: *source-mount
    # Chromium's sandbox needs more than the default 64MB of shared memory.
    shm_size: 1gb

volumes:
  # Parser model weights: downloaded once, kept across rebuilds.
  mineru-models:
